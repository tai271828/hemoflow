[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hemoflow-preprocessor"
version = "1.0.0"
description = "HemoFlow geometry preprocessor for LBM simulations"
readme = "README.md"
requires-python = "==3.9"
dependencies = [
    "numpy",
    "numpy-stl==3.2.0",
    "pynrrd==1.1.3",
    "vtk==9.1.0",
    "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
# Verification & validation harness (tests/verification at the repo root)
vv = [
    "pyvista",
    "matplotlib",
]

[project.scripts]
preprocessor = "preprocessor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocessor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
